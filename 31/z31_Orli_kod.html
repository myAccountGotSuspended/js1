<html>

<head>
    <script type="text/javascript">
        var owoc = {
            nazwa: 'Jabłko',
            kolor: 'Zielony',
            smak: 'Słodki',
            owoc_pokaz_orlinski: function () {
                document.write(this.nazwa + ' ' +'koloru '+ this.kolor+' o smaku '+this.smak)
            }
        }
        owoc.owoc_pokaz_orlinski();
        owoc.krajPochodzenia = 'Brazylia';
        owoc.owoc_wypisz_orlinski = function () { alert('Kraj pochodzenia: ' + this.krajPochodzenia) }
        owoc.owoc_wypisz_orlinski();
    </script>
</head>

<body>
    <br>
    Programowanie obiektowe. <br>
    Obiekt to owoc<br>
    Pola:<br>
    Nazwa<br>
    kolor<br>
    smak<br>
    metoda: owoc_pokaz_orlinski();<br>
    nowe pole to krajPochodzenia <br>
    nowa metoda to owoc_wypisz_orlinski();<br>
</body>
